[package]
name = "tuisana"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.29"
regex = "1"
unicode-width = "0.2"
arboard = "3"
jiff = "0.2.35"
